<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#0064D2"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF4FF"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B60"/>
      <stop offset="1" stop-color="#E6352A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#gloss)"/>

  <!-- 对话气泡 -->
  <rect x="196" y="236" width="632" height="424" rx="100" fill="url(#bubble)"/>
  <path d="M 322 636 L 322 774 Q 322 796 341 784 L 474 668 Z" fill="#EDF4FF"/>

  <!-- 气泡内的文字行 -->
  <rect x="292" y="352" width="368" height="46" rx="23" fill="#B9D6F8"/>
  <rect x="292" y="440" width="440" height="46" rx="23" fill="#CFE3FA"/>
  <rect x="292" y="528" width="264" height="46" rx="23" fill="#DDEBFC"/>

  <!-- 红色删除徽章 -->
  <circle cx="712" cy="692" r="168" fill="url(#badge)" stroke="#FFFFFF" stroke-width="26"/>

  <!-- 垃圾桶（白色，镂空条纹用底色绘制） -->
  <g>
    <!-- 提手 -->
    <rect x="664" y="576" width="96" height="30" rx="15" fill="#FFFFFF"/>
    <!-- 桶盖 -->
    <rect x="614" y="596" width="196" height="34" rx="17" fill="#FFFFFF"/>
    <!-- 桶身 -->
    <path d="M 636 652 L 788 652 L 774 800 Q 772 818 754 818 L 670 818 Q 652 818 650 800 Z" fill="#FFFFFF"/>
    <!-- 条纹镂空 -->
    <rect x="676" y="668" width="16" height="132" rx="8" fill="#E6352A"/>
    <rect x="704" y="668" width="16" height="132" rx="8" fill="#E6352A"/>
    <rect x="732" y="668" width="16" height="132" rx="8" fill="#E6352A"/>
  </g>
</svg>
